name:
  isotope:opentofu

replaces:
  brew:opentofu

build: |
  GOTOOLCHAIN=go1.26.6 go test -mod=readonly ./internal/command/cliconfig
  mkdir -p bin
  GOTOOLCHAIN=go1.26.6 CGO_ENABLED=0 go build \
    -mod=readonly -trimpath \
    -ldflags "-s -w -X github.com/opentofu/opentofu/version.dev=no" \
    -o bin/tofu ./cmd/tofu
  bin/tofu version | grep -F "OpenTofu v${VERSION}"
  codesign --force --options runtime --timestamp \
    --identifier tofu \
    --sign "$CODESIGN_IDENTITY" \
    bin/tofu
  tar czf out.tgz bin/tofu

justification:
  title:
    Unprotected Credential Access
  detail: |
    OpenTofu can store host tokens in plaintext configuration.

    This isotope uses OpenTofu's native credential-helper protocol so Automic
    Vault retains custody of host tokens and applies them only after policy or
    user approval. Only helper configuration remains on disk.
